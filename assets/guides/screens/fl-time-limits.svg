<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 620" width="376" height="620" role="img"><title>Time limits in Family Link. Leave Daily limit off and tap App limits. Apps set to Unlimited time are shown underneath.</title><rect x="0" y="0" width="376" height="620" rx="30" fill="#1D1D1F"/><defs><clipPath id="fl-time-limits-clip"><rect x="0" y="0" width="360" height="604" rx="23"/></clipPath></defs><g transform="translate(8 8)"><g clip-path="url(#fl-time-limits-clip)"><rect x="0" y="0" width="360" height="604" fill="#EEF2F8"/><text x="20" y="27" font-family="Inter" font-size="14" font-weight="500" fill="#000000">9:41</text><circle cx="180" cy="21" r="6" fill="#1D1D1F"/><path d="M284 26 l7 -9 7 9 z" fill="#000000"/><path d="M302 27 l10 -11 v11 z" fill="#000000"/><rect x="320" y="15" width="8" height="13" rx="1.5" fill="#000000"/><g transform="translate(18 57) scale(1)" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /> <path d="M19 12H5" /></g><text x="180" y="76" font-family="Inter" font-size="21" font-weight="400" fill="#1F1F1F" text-anchor="middle">Time limits</text><rect x="16" y="108" width="328" height="154" rx="24" fill="#FFF"/><circle cx="54" cy="148" r="22" fill="#EEF2F8"/><g transform="translate(43 137) scale(0.9167000000000001)" fill="none" stroke="#0B1D51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2" /> <line x1="12" x2="15" y1="14" y2="11" /> <circle cx="12" cy="14" r="8" /></g><rect x="273" y="133" width="50" height="30" rx="15" fill="#E1E3E1" stroke="#747775" stroke-width="2"/><circle cx="289" cy="148" r="8" fill="#747775"/><text x="36" y="204" font-family="Inter" font-size="16.5" font-weight="500" fill="#1F1F1F">Daily limit</text><text x="36" y="226" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Set the total time that Alex can spend on</text><text x="36" y="245" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">their devices daily</text><rect x="16" y="280" width="328" height="213" rx="24" fill="#FFF"/><circle cx="54" cy="320" r="22" fill="#EEF2F8"/><g transform="translate(43 309) scale(0.9167000000000001)" fill="none" stroke="#0B1D51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1" /> <circle cx="19" cy="5" r="1" /> <circle cx="5" cy="5" r="1" /> <circle cx="12" cy="12" r="1" /> <circle cx="19" cy="12" r="1" /> <circle cx="5" cy="12" r="1" /> <circle cx="12" cy="19" r="1" /> <circle cx="19" cy="19" r="1" /> <circle cx="5" cy="19" r="1" /></g><path d="M318 314 l6 6 -6 6" fill="none" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="376" font-family="Inter" font-size="16.5" font-weight="500" fill="#1F1F1F">App limits</text><text x="36" y="398" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Block, set time limits or choose unlimited</text><text x="36" y="417" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">time for individual apps</text><rect x="16" y="434" width="328" height="3" fill="#EEF2F8"/><circle cx="310" cy="465" r="13" fill="#25D366"/><g transform="translate(302 457) scale(0.6667000000000001)" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" /></g><circle cx="276" cy="465" r="13" fill="#34C759"/><g transform="translate(268 457) scale(0.6667000000000001)" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></g><text x="36" y="470.5" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Unlimited time</text><rect x="16" y="511" width="328" height="75" rx="18" fill="#E2E8F0"/><text x="34" y="533" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">Eligible devices will lock when daily limit is</text><text x="34" y="550" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">reached. Calls and apps set to unlimited will still</text><text x="34" y="567" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">be available.</text></g><rect x="259" y="123" width="78" height="50" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="252.6" y="112" width="74.4" height="21" rx="10.5" fill="#E8542F"/><text x="289.8" y="126.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Leave off</text><rect x="13" y="277" width="334" height="160" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="298.3" y="266" width="38.7" height="21" rx="10.5" fill="#E8542F"/><text x="317.7" y="280.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tap</text></g></svg>
