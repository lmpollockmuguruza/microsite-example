<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 431" width="376" height="431" role="img"><title>Allowed apps in Family Link. Turn on Unlimited apps, so the apps you set to Unlimited time still work during downtime.</title><rect x="0" y="0" width="376" height="431" rx="30" fill="#1D1D1F"/><defs><clipPath id="fl-allowed-apps-clip"><rect x="0" y="0" width="360" height="415" rx="23"/></clipPath></defs><g transform="translate(8 8)"><g clip-path="url(#fl-allowed-apps-clip)"><rect x="0" y="0" width="360" height="415" fill="#EEF2F8"/><text x="20" y="27" font-family="Inter" font-size="14" font-weight="500" fill="#000000">9:41</text><circle cx="180" cy="21" r="6" fill="#1D1D1F"/><path d="M284 26 l7 -9 7 9 z" fill="#000000"/><path d="M302 27 l10 -11 v11 z" fill="#000000"/><rect x="320" y="15" width="8" height="13" rx="1.5" fill="#000000"/><g transform="translate(18 57) scale(1)" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /> <path d="M19 12H5" /></g><text x="180" y="76" font-family="Inter" font-size="21" font-weight="400" fill="#1F1F1F" text-anchor="middle">Allowed apps</text><rect x="16" y="108" width="328" height="213" rx="24" fill="#FFF"/><circle cx="54" cy="148" r="22" fill="#EEF2F8"/><g transform="translate(43 137) scale(0.9167000000000001)" fill="none" stroke="#0B1D51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16c5 0 7-8 12-8a4 4 0 0 1 0 8c-5 0-7-8-12-8a4 4 0 1 0 0 8" /></g><rect x="272" y="132" width="52" height="32" rx="16" fill="#0B57D0"/><circle cx="308" cy="148" r="12" fill="#FFF"/><path d="M303 148 l3.5 3.5 7 -7" fill="none" stroke="#0B57D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="204" font-family="Inter" font-size="16.5" font-weight="500" fill="#1F1F1F">Unlimited apps</text><text x="36" y="226" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Allow Alex to access unlimited apps during</text><text x="36" y="245" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">downtime</text><rect x="16" y="262" width="328" height="3" fill="#EEF2F8"/><path d="M316 287 l6 6 -6 6" fill="none" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="298.5" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">9 apps selected</text><rect x="16" y="339" width="328" height="58" rx="18" fill="#E2E8F0"/><text x="34" y="361" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">Alex can always call during downtime. You can</text><text x="34" y="378" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">select if unlimited apps can be used too.</text></g><rect x="259" y="123" width="78" height="50" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="265.6" y="112" width="61.4" height="21" rx="10.5" fill="#E8542F"/><text x="296.3" y="126.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Turn on</text></g></svg>
