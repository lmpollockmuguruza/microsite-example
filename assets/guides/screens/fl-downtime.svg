<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 775" width="376" height="775" role="img"><title>Schedules in Family Link. Turn on Downtime and set its weekly schedule to 12:00–11:59. Leave School time off.</title><rect x="0" y="0" width="376" height="775" rx="30" fill="#1D1D1F"/><defs><clipPath id="fl-downtime-clip"><rect x="0" y="0" width="360" height="759" rx="23"/></clipPath></defs><g transform="translate(8 8)"><g clip-path="url(#fl-downtime-clip)"><rect x="0" y="0" width="360" height="759" fill="#EEF2F8"/><text x="20" y="27" font-family="Inter" font-size="14" font-weight="500" fill="#000000">9:41</text><circle cx="180" cy="21" r="6" fill="#1D1D1F"/><path d="M284 26 l7 -9 7 9 z" fill="#000000"/><path d="M302 27 l10 -11 v11 z" fill="#000000"/><rect x="320" y="15" width="8" height="13" rx="1.5" fill="#000000"/><g transform="translate(18 57) scale(1)" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /> <path d="M19 12H5" /></g><text x="180" y="76" font-family="Inter" font-size="21" font-weight="400" fill="#1F1F1F" text-anchor="middle">Schedules</text><rect x="16" y="108" width="328" height="351" rx="24" fill="#FFF"/><circle cx="54" cy="148" r="22" fill="#EEF2F8"/><g transform="translate(43 137) scale(0.9167000000000001)" fill="none" stroke="#0B1D51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></g><rect x="272" y="132" width="52" height="32" rx="16" fill="#0B57D0"/><circle cx="308" cy="148" r="12" fill="#FFF"/><path d="M303 148 l3.5 3.5 7 -7" fill="none" stroke="#0B57D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="204" font-family="Inter" font-size="16.5" font-weight="500" fill="#1F1F1F">Downtime</text><text x="36" y="226" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Help Alex sleep by limiting access on their</text><text x="36" y="245" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">devices at night</text><rect x="16" y="262" width="328" height="3" fill="#EEF2F8"/><text x="324" y="298" font-family="Inter" font-size="15" font-weight="400" fill="#1F1F1F" text-anchor="end">12:00–11:59</text><text x="36" y="298.5" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Tonight</text><rect x="16" y="321" width="328" height="3" fill="#EEF2F8"/><path d="M316 351 l6 6 -6 6" fill="none" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="353" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Weekly schedule</text><text x="36" y="374" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Every night, 12:00–11:59</text><rect x="16" y="390" width="328" height="3" fill="#EEF2F8"/><path d="M316 420 l6 6 -6 6" fill="none" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="422" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Allowed apps</text><text x="36" y="443" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Unlimited apps are turned on</text><rect x="16" y="477" width="328" height="154" rx="24" fill="#FFF"/><circle cx="54" cy="517" r="22" fill="#EEF2F8"/><g transform="translate(43 506) scale(0.9167000000000001)" fill="none" stroke="#0B1D51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 21v-3a2 2 0 0 0-4 0v3" /> <path d="M18 4.933V21" /> <path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6" /> <path d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11" /> <path d="M6 4.933V21" /> <circle cx="12" cy="9" r="2" /></g><rect x="273" y="502" width="50" height="30" rx="15" fill="#E1E3E1" stroke="#747775" stroke-width="2"/><circle cx="289" cy="517" r="8" fill="#747775"/><text x="36" y="573" font-family="Inter" font-size="16.5" font-weight="500" fill="#1F1F1F">School time</text><text x="36" y="595" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Minimise distractions on Alex's devices during</text><text x="36" y="614" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">class</text><rect x="16" y="649" width="328" height="92" rx="18" fill="#E2E8F0"/><text x="34" y="671" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">Eligible devices will be locked during downtime</text><text x="34" y="688" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">and be silenced during school time. Access to</text><text x="34" y="705" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">certain apps will be limited. Calls will still be</text><text x="34" y="722" font-family="Inter" font-size="12.5" font-weight="400" fill="#444746">available.</text></g><rect x="259" y="123" width="78" height="50" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="265.6" y="112" width="61.4" height="21" rx="10.5" fill="#E8542F"/><text x="296.3" y="126.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Turn on</text><rect x="13" y="321" width="334" height="72" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="204.5" y="310" width="132.5" height="21" rx="10.5" fill="#E8542F"/><text x="270.8" y="324.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Set to 12:00–11:59</text><rect x="13" y="390" width="334" height="72" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="269.1" y="379" width="67.9" height="21" rx="10.5" fill="#E8542F"/><text x="303" y="393.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Then tap</text></g></svg>
