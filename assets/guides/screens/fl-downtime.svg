<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 404" width="376" height="404" role="img"><title>Screen time in Family Link, on the Downtime tab, with the Downtime switch turned on.</title><rect x="0" y="0" width="376" height="404" rx="30" fill="#1D1D1F"/><defs><clipPath id="fl-downtime-clip"><rect x="0" y="0" width="360" height="388" rx="23"/></clipPath></defs><g transform="translate(8 8)"><g clip-path="url(#fl-downtime-clip)"><rect x="0" y="0" width="360" height="388" fill="#FFFFFF"/><text x="20" y="27" font-family="Inter" font-size="14" font-weight="500" fill="#000000">9:41</text><circle cx="180" cy="21" r="6" fill="#1D1D1F"/><path d="M284 26 l7 -9 7 9 z" fill="#000000"/><path d="M302 27 l10 -11 v11 z" fill="#000000"/><rect x="320" y="15" width="8" height="13" rx="1.5" fill="#000000"/><g transform="translate(18 57) scale(1)" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /> <path d="M19 12H5" /></g><text x="62" y="76" font-family="Inter" font-size="21" font-weight="400" fill="#1F1F1F">Screen time</text><text x="60" y="130" font-family="Inter" font-size="14" font-weight="600" fill="#444746" text-anchor="middle">Daily limit</text><text x="180" y="130" font-family="Inter" font-size="14" font-weight="600" fill="#0B57D0" text-anchor="middle">Downtime</text><rect x="152" y="147" width="56" height="3" rx="1.5" fill="#0B57D0"/><text x="300" y="130" font-family="Inter" font-size="14" font-weight="600" fill="#444746" text-anchor="middle">App limits</text><rect x="0" y="150" width="360" height="1" fill="#E1E3E1"/><rect x="288" y="180" width="52" height="32" rx="16" fill="#0B57D0"/><circle cx="324" cy="196" r="12" fill="#FFF"/><path d="M319 196 l3.5 3.5 7 -7" fill="none" stroke="#0B57D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="193" font-family="Inter" font-size="16" font-weight="400" fill="#1F1F1F">Downtime</text><text x="20" y="213" font-family="Inter" f