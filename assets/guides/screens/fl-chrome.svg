<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 661" width="376" height="661" role="img"><title>Google Chrome and web in Family Link, set to Only allow approved sites. Add the sites on the list under Approved sites.</title><rect x="0" y="0" width="376" height="661" rx="30" fill="#1D1D1F"/><defs><clipPath id="fl-chrome-clip"><rect x="0" y="0" width="360" height="645" rx="23"/></clipPath></defs><g transform="translate(8 8)"><g clip-path="url(#fl-chrome-clip)"><rect x="0" y="0" width="360" height="645" fill="#EEF2F8"/><text x="20" y="27" font-family="Inter" font-size="14" font-weight="500" fill="#000000">9:41</text><circle cx="180" cy="21" r="6" fill="#1D1D1F"/><path d="M284 26 l7 -9 7 9 z" fill="#000000"/><path d="M302 27 l10 -11 v11 z" fill="#000000"/><rect x="320" y="15" width="8" height="13" rx="1.5" fill="#000000"/><g transform="translate(18 57) scale(1)" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /> <path d="M19 12H5" /></g><text x="180" y="76" font-family="Inter" font-size="21" font-weight="400" fill="#1F1F1F" text-anchor="middle">Google Chrome and web</text><text x="20" y="120" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">You can control which sites Alex visits when</text><text x="20" y="139" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">signed in to Chrome, as well as in some Android</text><text x="20" y="158" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">apps. Alex can ask to visit blocked sites too.</text><rect x="16" y="181" width="328" height="194" rx="24" fill="#FFF"/><circle cx="46" cy="209" r="10" fill="none" stroke="#444746" stroke-width="2.2"/><text x="80" y="214.5" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Allow all sites</text><rect x="16" y="237" width="328" height="3" fill="#EEF2F8"/><circle cx="46" cy="273" r="10" fill="none" stroke="#444746" stroke-width="2.2"/><text x="80" y="269" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Try to block explicit sites</text><text x="80" y="290" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">No filter is perfect, but this should…</text><rect x="16" y="306" width="328" height="3" fill="#EEF2F8"/><circle cx="46" cy="342" r="10" fill="none" stroke="#0B57D0" stroke-width="2.2"/><circle cx="46" cy="342" r="5.5" fill="#0B57D0"/><text x="80" y="338" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Only allow approved sites</text><text x="80" y="359" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Customise your own list and approve…</text><rect x="16" y="393" width="328" height="232" rx="24" fill="#FFF"/><text x="36" y="429" font-family="Inter" font-size="16.5" font-weight="500" fill="#1F1F1F">Manage sites</text><text x="36" y="451" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">Allow specific sites for Alex and block sites</text><text x="36" y="470" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">that you don't want them visiting</text><rect x="16" y="487" width="328" height="3" fill="#EEF2F8"/><path d="M316 517 l6 6 -6 6" fill="none" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="519" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Approved sites</text><text x="36" y="540" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">2 sites</text><rect x="16" y="556" width="328" height="3" fill="#EEF2F8"/><path d="M316 586 l6 6 -6 6" fill="none" stroke="#444746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="588" font-family="Inter" font-size="15.5" font-weight="400" fill="#1F1F1F">Blocked sites</text><text x="36" y="609" font-family="Inter" font-size="13.5" font-weight="400" fill="#444746">0 sites</text></g><rect x="13" y="306" width="334" height="72" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="252.9" y="295" width="84.1" height="21" rx="10.5" fill="#E8542F"/><text x="294.9" y="309.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Choose this</text><rect x="13" y="487" width="334" height="72" rx="12" fill="none" stroke="#E8542F" stroke-width="2.5"/><rect x="181.4" y="476" width="155.6" height="21" rx="10.5" fill="#E8542F"/><text x="259.2" y="490.5" font-family="Inter" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add the sites on the list</text></g></svg>
