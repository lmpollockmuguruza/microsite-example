<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842"><rect x="0" y="0.0" width="595" height="842.0" rx="0" fill="#FFFAF3"/><rect x="0" y="0.0" width="595" height="64.0" rx="0" fill="#003A69"/><circle cx="58" cy="32" r="20" fill="#FFFFFF"/><g transform="translate(44 18) scale(0.5833333333333334)"><circle cx="35" cy="13" r="8" fill="#ffc845"/><circle cx="18" cy="19" r="6.5" fill="#ff7a5c"/><path d="M7 44v-5a11 11 0 0 1 22 0v5z" fill="#ff7a5c"/><circle cx="32" cy="28" r="4.8" fill="#37c3a0"/><path d="M24.5 44v-2.5a7.5 7.5 0 0 1 15 0V44z" fill="#37c3a0"/></g><text x="88" y="38" font-family="Nunito" font-size="17" font-weight="900" fill="#FFFFFF">The SMART Study</text><text x="555" y="37" font-family="Inter" font-size="9.5" font-weight="700" fill="#FFC845" text-anchor="end" letter-spacing=".6">INVITATION FOR SCHOOL LEADERS</text><text x="40" y="111.0" font-family="Nunito" font-size="25" font-weight="900" fill="#003A69" xml:space="preserve">Will your school help find out what's best</text><text x="40" y="140.0" font-family="Nunito" font-size="25" font-weight="900" fill="#003A69" xml:space="preserve">for children and phones?</text><text x="40" y="163.0" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve">Nobody knows yet the best age for a first smartphone, or how best to set one up. The SMART Study</text><text x="40" y="178.5" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve">will help find out, for the Department for Education. We're inviting around 80 primary schools in</text><text x="40" y="194.0" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve">England, with their pupils in<tspan font-weight="700"> Years 3 to 5</tspan>, from<tspan font-weight="700"> September 2027</tspan> to<tspan font-weight="700"> September 2028</tspan>.</text><rect x="40" y="212.1" width="515" height="90.2" rx="16" fill="#FFF1C9"/><text x="60" y="246.1" font-family="Nunito" font-size="18" font-weight="900" fill="#003A69" xml:space="preserve">Will your school take part?</text><text x="60" y="269.3" font-family="Inter" font-size="12" font-weight="400" fill="#12263F" xml:space="preserve">Sign up by<tspan font-weight="700"> [date]</tspan> at<tspan font-weight="700"> [web address]</tspan>, or reply to this email. It takes</text><text x="60" y="285.8" font-family="Inter" font-size="12" font-weight="400" fill="#12263F" xml:space="preserve">about 5 minutes.</text><rect x="477" y="224.2" width="66" height="66.0" rx="8" fill="#FFFFFF" stroke="#003A69" stroke-width="1.2" stroke-dasharray="4 3"/><text x="510" y="260.2" font-family="Inter" font-size="8.5" fill="#4A5B70" text-anchor="middle">[QR code]</text><text x="40" y="334.0" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" xml:space="preserve">What taking part involves for your school</text><rect x="45" y="354.6" width="2" height="112.6" fill="#FFC845"/><circle cx="46" cy="354.6" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="357.6" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Summer term 2027</tspan></text><text x="174" y="357.6" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Sign up and name a contact. Share our invitation with families in Years 3 to 5: we</text><text x="174" y="371.6" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">give you everything you need.</text><circle cx="46" cy="392.1" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="395.1" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Autumn term 2027</tspan></text><text x="174" y="395.1" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Pupils do the first of two short reading and maths assessments (in the PIRA and</text><text x="174" y="409.1" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">PUMA format many schools already use) in class, about<tspan font-weight="700"> [45] minutes</tspan>.</text><circle cx="46" cy="429.7" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="432.7" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">During the year</tspan></text><text x="174" y="432.7" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Pass on our messages and posters to families now and then, and give us short</text><text x="174" y="446.7" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">feedback three times. No extra teaching.</text><circle cx="46" cy="467.2" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="470.2" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Summer term 2028</tspan></text><text x="174" y="470.2" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Pupils do the second assessment. The study ends in September 2028.</text><rect x="40" y="490.6" width="515" height="80.4" rx="14" fill="#EEF6FD"/><circle cx="66" cy="516.5866666666667" r="14" fill="#FFFFFF"/><g transform="translate(58 508.5866666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <path d="M16 3.128a4 4 0 0 1 0 7.744" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <circle cx="9" cy="7" r="4" /></g><text x="92" y="513.4" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Two groups, chosen by chance.</tspan> To make it a fair test, schools are split into two groups by</text><text x="92" y="527.0" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">chance. In one, families follow a simple plan until September 2028: if their child has no</text><text x="92" y="540.6" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">smartphone, they wait; if they have one, they set it up with a short list of apps. In the other,</text><text x="92" y="554.2" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">families carry on as usual. Every school does the same assessments and surveys.</text><text x="40" y="602.6" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" xml:space="preserve">What you get, whichever group you're in</text><rect x="40" y="616.2" width="121.25" height="125.5" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="68" cy="641.2266666666667" r="14" fill="#E6F7F1"/><g transform="translate(60 633.2266666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 21v-3a2 2 0 0 0-4 0v3" /> <path d="M18 4.933V21" /> <path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6" /> <path d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11" /> <path d="M6 4.933V21" /> <circle cx="12" cy="9" r="2" /></g><text x="54" y="673.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">£500 for your</text><text x="54" y="687.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">school</text><text x="54" y="701.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">For taking part, plus</text><text x="54" y="714.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">[£XX] for each</text><text x="54" y="726.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">feedback round.</text><rect x="171.25" y="616.2" width="121.25" height="125.5" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="199.25" cy="641.2266666666667" r="14" fill="#FDE7D3"/><g transform="translate(191.25 633.2266666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" /> <path d="M18 17V9" /> <path d="M13 17V5" /> <path d="M8 17v-3" /></g><text x="185.25" y="673.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">Your pupils'</text><text x="185.25" y="687.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">results</text><text x="185.25" y="701.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">Reading and maths</text><text x="185.25" y="714.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">scores from both</text><text x="185.25" y="726.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">assessments.</text><rect x="302.5" y="616.2" width="121.25" height="125.5" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="330.5" cy="641.2266666666667" r="14" fill="#EFEAFD"/><g transform="translate(322.5 633.2266666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" /></g><text x="316.5" y="673.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">Resources for</text><text x="316.5" y="687.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">families</text><text x="316.5" y="701.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">Motivational videos,</text><text x="316.5" y="714.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">comic books and a</text><text x="316.5" y="726.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">newsletter.</text><rect x="433.75" y="616.2" width="121.25" height="125.5" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="461.75" cy="641.2266666666667" r="14" fill="#FFF1C9"/><g transform="translate(453.75 633.2266666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></g><text x="447.75" y="673.7" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">What we find</text><text x="447.75" y="687.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">A summary of the</text><text x="447.75" y="700.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">findings, shared with</text><text x="447.75" y="712.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">you first.</text><rect x="40" y="758" width="515" height="1" fill="#DFE5EC"/><text x="40" y="776.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Taking part is your school's choice, and you can stop at any time.</tspan></text><text x="40" y="792.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve">Questions? Email smartphonestudy@public.io, or call [phone number].</text><text x="40" y="810.5" font-family="Inter" font-size="8.5" font-weight="400" fill="#4A5B70" xml:space="preserve">Run by IFF Research, PUBLIC and the University of Cambridge for the Department for Education.</text></svg>
