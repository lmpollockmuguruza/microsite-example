<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842"><rect x="0" y="0.0" width="595" height="842.0" rx="0" fill="#FFFFFF"/><g transform="translate(44 36) scale(0.5416666666666666)"><circle cx="35" cy="13" r="8" fill="#ffc845"/><circle cx="18" cy="19" r="6.5" fill="#ff7a5c"/><path d="M7 44v-5a11 11 0 0 1 22 0v5z" fill="#ff7a5c"/><circle cx="32" cy="28" r="4.8" fill="#37c3a0"/><path d="M24.5 44v-2.5a7.5 7.5 0 0 1 15 0V44z" fill="#37c3a0"/></g><text x="78" y="54" font-family="Inter" font-size="10" font-weight="700" fill="#C4412A" letter-spacing=".6">THE SMART STUDY · GUIDE FOR FAMILIES</text><text x="44" y="104.0" font-family="Nunito" font-size="26" font-weight="900" fill="#003A69" xml:space="preserve">Waiting for a first smartphone</text><text x="44" y="125.5" font-family="Inter" font-size="11.5" font-weight="400" fill="#4A5B70" xml:space="preserve">Thank you for taking part. This is everything we're asking, on one page.</text><rect x="44" y="144.1" width="507" height="119.1" rx="14" fill="#FFF1C9"/><text x="62" y="173.1" font-family="Nunito" font-size="13" font-weight="800" fill="#003A69" xml:space="preserve">What we're asking</text><text x="62" y="195.3" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">Until<tspan font-weight="700"> April 2028</tspan>, please hold off getting your child their own smartphone.</text><text x="62" y="217.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#4A5B70" xml:space="preserve">Nothing else needs to change. Your child can still:</text><rect x="62" y="227.2" width="162.69119999999992" height="20.0" rx="10" fill="#FFFFFF"/><text x="73" y="240.69999999999996" font-family="Inter" font-size="9.5" fill="#12263F">Use a family tablet or computer</text><rect x="230.69119999999992" y="227.2" width="147.37719999999993" height="20.0" rx="10" fill="#FFFFFF"/><text x="241.69119999999992" y="240.69999999999996" font-family="Inter" font-size="9.5" fill="#12263F">Borrow your phone, with you</text><rect x="384.0683999999999" y="227.2" width="166.6925999999999" height="20.0" rx="10" fill="#FFFFFF"/><text x="395.0683999999999" y="240.69999999999996" font-family="Inter" font-size="9.5" fill="#12263F">Play games and watch TV, as now</text><text x="44" y="292.2" font-family="Nunito" font-size="13" font-weight="800" fill="#003A69" xml:space="preserve">Why it matters</text><text x="44" y="309.4" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Nobody knows yet the best age for a first smartphone. By waiting a little longer, your family is helping to</text><text x="44" y="323.4" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">answer that question for parents everywhere. Other families at your child's school are taking part too, so</text><text x="44" y="337.4" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">your child won't be the only one waiting.</text><text x="44" y="366.4" font-family="Nunito" font-size="13" font-weight="800" fill="#003A69" xml:space="preserve">Five things that make it easier</text><circle cx="53" cy="384.5999999999999" r="9" fill="#FFC845"/><text x="53" y="388.0999999999999" font-family="Nunito" font-size="10" font-weight="900" fill="#003A69" text-anchor="middle">1</text><text x="70" y="385.6" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Tell your child together, and say why.</tspan> Children find waiting easier when they know the reason, and</text><text x="70" y="399.6" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">know it isn't forever.</text><rect x="70" y="407.6" width="481" height="51.9" rx="8" fill="#EEF6FD"/><text x="82" y="423.1" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" font-style="italic" xml:space="preserve">&quot;Our school is helping with a big study about children and phones. We're one of the families waiting a</text><text x="82" y="436.4" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" font-style="italic" xml:space="preserve">bit longer for a phone. It's until April 2028, and it helps grown-ups work out what's best for</text><text x="82" y="449.7" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" font-style="italic" xml:space="preserve">children.&quot;</text><circle cx="53" cy="472.4999999999999" r="9" fill="#FFC845"/><text x="53" y="475.9999999999999" font-family="Nunito" font-size="10" font-weight="900" fill="#003A69" text-anchor="middle">2</text><text x="70" y="473.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Put the date on the calendar.</tspan> Mark April 2028 somewhere your child can see it. A clear end date</text><text x="70" y="487.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">makes waiting feel fair.</text><circle cx="53" cy="504.4999999999999" r="9" fill="#FFC845"/><text x="53" y="507.9999999999999" font-family="Nunito" font-size="10" font-weight="900" fill="#003A69" text-anchor="middle">3</text><text x="70" y="505.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Tell family and friends early.</tspan> Phones are a common birthday or Christmas present. Let grandparents</text><text x="70" y="519.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">and others know about the study now, so nobody is caught out.</text><circle cx="53" cy="536.4999999999999" r="9" fill="#FFC845"/><text x="53" y="539.9999999999999" font-family="Nunito" font-size="10" font-weight="900" fill="#003A69" text-anchor="middle">4</text><text x="70" y="537.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Agree how you'll stay in touch.</tspan> For trips and clubs, your child can borrow a family phone. If you think</text><text x="70" y="551.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">your child needs a phone of their own for safety, email smartphonestudy@public.io first and we'll talk</text><text x="70" y="565.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">it through.</text><circle cx="53" cy="582.4999999999999" r="9" fill="#FFC845"/><text x="53" y="585.9999999999999" font-family="Nunito" font-size="10" font-weight="900" fill="#003A69" text-anchor="middle">5</text><text x="70" y="583.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Plan ahead for secondary school.</tspan> Starting Year 7 is when many children get a phone. If your child</text><text x="70" y="597.5" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">moves up during the study, plan the journey to school, and how you'll keep in touch, before the summer.</text><rect x="44" y="613.5" width="247.5" height="95.9" rx="12" fill="#E6F7F1"/><text x="58" y="636.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">If you hear &quot;Everyone else has one&quot;</tspan></text><text x="58" y="651.7" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">It's normal for children to say this. Listen,</text><text x="58" y="665.0" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">agree that waiting can feel hard, and remind</text><text x="58" y="678.3" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">them of the date and the reason.</text><rect x="303.5" y="613.5" width="247.5" height="95.9" rx="12" fill="#FDE7D3"/><text x="317.5" y="636.0" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">If your child does get a smartphone</tspan></text><text x="317.5" y="651.7" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">It happens, and it's fine to tell us. Please stay in</text><text x="317.5" y="665.0" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">the study and let us know at</text><text x="317.5" y="678.3" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">smartphonestudy@public.io. Your answers are</text><text x="317.5" y="691.6" font-family="Inter" font-size="9.5" font-weight="400" fill="#12263F" xml:space="preserve">still really useful.</text><rect x="44" y="792" width="507" height="1" fill="#DFE5EC"/><text x="44" y="806.0" font-family="Inter" font-size="8" font-weight="400" fill="#4A5B70" xml:space="preserve">Questions? Email smartphonestudy@public.io. Run by IFF Research and the University of Cambridge for the Department for Education.</text></svg>
