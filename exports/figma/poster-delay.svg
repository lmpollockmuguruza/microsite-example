<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842"><rect x="0" y="0.0" width="595" height="842.0" rx="0" fill="#FFFAF3"/><rect x="0" y="0.0" width="595" height="64.0" rx="0" fill="#003A69"/><circle cx="58" cy="32" r="20" fill="#FFFFFF"/><g transform="translate(44 18) scale(0.5833333333333334)"><circle cx="35" cy="13" r="8" fill="#ffc845"/><circle cx="18" cy="19" r="6.5" fill="#ff7a5c"/><path d="M7 44v-5a11 11 0 0 1 22 0v5z" fill="#ff7a5c"/><circle cx="32" cy="28" r="4.8" fill="#37c3a0"/><path d="M24.5 44v-2.5a7.5 7.5 0 0 1 15 0V44z" fill="#37c3a0"/></g><text x="88" y="38" font-family="Nunito" font-size="17" font-weight="900" fill="#FFFFFF">The SMART Study</text><text x="555" y="37" font-family="Inter" font-size="10" font-weight="700" fill="#FFC845" text-anchor="end" letter-spacing=".6">[SCHOOL NAME] IS TAKING PART</text><text x="40" y="126.0" font-family="Nunito" font-size="34" font-weight="900" fill="#003A69" xml:space="preserve">Together, we're waiting a</text><text x="40" y="164.0" font-family="Nunito" font-size="34" font-weight="900" fill="#003A69" xml:space="preserve">little longer for smartphones</text><text x="40" y="193.0" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">Around 80 primary schools in England are part of the SMART Study, from April 2027</text><text x="40" y="211.5" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">to April 2028. Thank you for being one of them.</text><text x="40" y="233.5" font-family="Inter" font-size="11.5" font-weight="400" fill="#4A5B70" font-style="italic" xml:space="preserve">– [Headteacher name], Headteacher</text><text x="40" y="285.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">What we're asking families taking part:</tspan></text><rect x="40" y="299.0" width="515" height="126.0" rx="16" fill="#FFF1C9"/><circle cx="70" cy="324.975" r="14" fill="#FFFFFF"/><g transform="translate(61 315.975) scale(0.75)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /></g><text x="58" y="364.0" font-family="Nunito" font-size="17" font-weight="900" fill="#003A69" xml:space="preserve">Waiting for a first smartphone</text><text x="58" y="384.5" font-family="Inter" font-size="12.5" font-weight="400" fill="#12263F" xml:space="preserve">If your child doesn't have a smartphone yet, hold off until<tspan font-weight="700"> April 2028</tspan>. Your guide</text><text x="58" y="402.0" font-family="Inter" font-size="12.5" font-weight="400" fill="#12263F" xml:space="preserve">has ideas for making it easier.</text><text x="40" y="443.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#4A5B70" xml:space="preserve">No plan in your pack? You don't need to do anything.</text><text x="40" y="500.1" font-family="Nunito" font-size="18" font-weight="900" fill="#003A69" xml:space="preserve">Three steps this week</text><circle cx="53" cy="529.25" r="13" fill="#FFC845"/><text x="53" y="534.25" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" text-anchor="middle">1</text><text x="78" y="532.3" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">Find your<tspan font-weight="700"> welcome pack</tspan> and family sign-in.</text><circle cx="53" cy="563.25" r="13" fill="#FFC845"/><text x="53" y="568.25" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" text-anchor="middle">2</text><text x="78" y="566.3" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">Sit down with your child for<tspan font-weight="700"> 10 minutes</tspan> and talk it</text><text x="78" y="584.3" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">through.</text><circle cx="53" cy="609.25" r="13" fill="#FFC845"/><text x="53" y="614.25" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" text-anchor="middle">3</text><text x="78" y="612.3" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">Go to<tspan font-weight="700"> [web address]</tspan> and follow your guide.</text><rect x="451" y="486.1" width="104" height="104.0" rx="10" fill="#FFFFFF" stroke="#003A69" stroke-width="1.5" stroke-dasharray="5 4"/><text x="503" y="542.05" font-family="Inter" font-size="10" fill="#4A5B70" text-anchor="middle">[QR code]</text><rect x="40" y="665.6" width="515" height="64.0" rx="16" fill="#FFF1C9"/><circle cx="70" cy="697.625" r="16" fill="#FFC845"/><g transform="translate(61 688.625) scale(0.75)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></g><text x="98" y="693.6" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Children: thank you!</tspan> You're helping grown-ups everywhere work out</text><text x="98" y="711.6" font-family="Inter" font-size="13" font-weight="400" fill="#12263F" xml:space="preserve">what's best for children.</text><rect x="40" y="774" width="515" height="1" fill="#DFE5EC"/><text x="40" y="794.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve">Questions? Ask [staff name] at school, or email smartphonestudy@public.io.</text><text x="40" y="812.5" font-family="Inter" font-size="8.5" font-weight="400" fill="#4A5B70" xml:space="preserve">Run by IFF Research and the University of Cambridge for the Department for Education.</text></svg>
