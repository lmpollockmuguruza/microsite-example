<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842"><rect x="0" y="0.0" width="595" height="842.0" rx="0" fill="#FFFAF3"/><rect x="0" y="0.0" width="595" height="64.0" rx="0" fill="#003A69"/><circle cx="58" cy="32" r="20" fill="#FFFFFF"/><g transform="translate(44 18) scale(0.5833333333333334)"><circle cx="35" cy="13" r="8" fill="#ffc845"/><circle cx="18" cy="19" r="6.5" fill="#ff7a5c"/><path d="M7 44v-5a11 11 0 0 1 22 0v5z" fill="#ff7a5c"/><circle cx="32" cy="28" r="4.8" fill="#37c3a0"/><path d="M24.5 44v-2.5a7.5 7.5 0 0 1 15 0V44z" fill="#37c3a0"/></g><text x="88" y="38" font-family="Nunito" font-size="17" font-weight="900" fill="#FFFFFF">The SMART Study</text><text x="555" y="37" font-family="Inter" font-size="9.5" font-weight="700" fill="#FFC845" text-anchor="end" letter-spacing=".6">INVITATION FOR PARENTS AND CARERS</text><text x="40" y="111.0" font-family="Nunito" font-size="25" font-weight="900" fill="#003A69" xml:space="preserve">Will your family help find out what's best</text><text x="40" y="140.0" font-family="Nunito" font-size="25" font-weight="900" fill="#003A69" xml:space="preserve">for children and phones?</text><text x="40" y="163.0" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve">Nobody knows yet the best age for a first smartphone, or how best to set one up.<tspan font-weight="700"> [School name]</tspan> is</text><text x="40" y="178.5" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve">helping to find out, as one of around 80 primary schools in the SMART Study. It runs from</text><text x="40" y="194.0" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">September 2027</tspan> to<tspan font-weight="700"> September 2028</tspan>, for children in<tspan font-weight="700"> Years 3 to 5</tspan>, and we'd love your family to</text><text x="40" y="209.5" font-family="Inter" font-size="11" font-weight="400" fill="#12263F" xml:space="preserve">take part.</text><rect x="40" y="227.5" width="515" height="90.2" rx="16" fill="#FFF1C9"/><text x="60" y="261.5" font-family="Nunito" font-size="18" font-weight="900" fill="#003A69" xml:space="preserve">Will you take part?</text><text x="60" y="284.7" font-family="Inter" font-size="12" font-weight="400" fill="#12263F" xml:space="preserve">Say yes by<tspan font-weight="700"> [date]</tspan>: scan the QR code or go to<tspan font-weight="700"> [web address]</tspan>. It</text><text x="60" y="301.2" font-family="Inter" font-size="12" font-weight="400" fill="#12263F" xml:space="preserve">takes about 5 minutes.</text><rect x="477" y="239.6" width="66" height="66.0" rx="8" fill="#FFFFFF" stroke="#003A69" stroke-width="1.2" stroke-dasharray="4 3"/><text x="510" y="275.6" font-family="Inter" font-size="8.5" fill="#4A5B70" text-anchor="middle">[QR code]</text><text x="40" y="349.2" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" xml:space="preserve">What taking part involves for your family</text><rect x="45" y="369.8" width="2" height="110.5" fill="#FFC845"/><circle cx="46" cy="369.8" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="372.8" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Before September</tspan></text><text x="60" y="385.8" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">2027</tspan></text><text x="174" y="372.8" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Say yes, and fill in a short online survey (about<tspan font-weight="700"> [10] minutes</tspan>).</text><circle cx="46" cy="405.3" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="408.3" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Autumn term 2027</tspan></text><text x="174" y="408.3" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Your child does the first of two short reading and maths assessments (in the</text><text x="174" y="422.3" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">PIRA and PUMA format many schools already use) at school. There's nothing to</text><text x="174" y="436.3" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">prepare.</text><circle cx="46" cy="456.9" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="459.9" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">During the year</tspan></text><text x="174" y="459.9" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">[Two]</tspan> more short online surveys for you, about<tspan font-weight="700"> [10] minutes</tspan> each.</text><circle cx="46" cy="480.4" r="5" fill="#FFC845" stroke="#FFFAF3" stroke-width="2"/><text x="60" y="483.4" font-family="Inter" font-size="10" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Summer term 2028</tspan></text><text x="174" y="483.4" font-family="Inter" font-size="10" font-weight="400" fill="#12263F" xml:space="preserve">Your child does the second assessment, and you fill in a last survey.</text><rect x="40" y="503.6" width="515" height="94.0" rx="14" fill="#EEF6FD"/><circle cx="66" cy="529.6266666666667" r="14" fill="#FFFFFF"/><g transform="translate(58 521.6266666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <path d="M16 3.128a4 4 0 0 1 0 7.744" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <circle cx="9" cy="7" r="4" /></g><text x="92" y="526.4" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve"><tspan font-weight="700">Two groups, chosen by chance.</tspan> To make it a fair test, schools are split into two groups by</text><text x="92" y="540.0" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">chance. In one, families follow a simple plan until September 2028: if their child has no</text><text x="92" y="553.6" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">smartphone, they wait; if they have one, they set it up with a short list of apps and share a</text><text x="92" y="567.2" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">screen time screenshot once a month, with our step-by-step help. In the other, families carry on</text><text x="92" y="580.8" font-family="Inter" font-size="9.8" font-weight="400" fill="#12263F" xml:space="preserve">as usual. Everyone does the same surveys and assessments.</text><text x="40" y="629.1" font-family="Nunito" font-size="14" font-weight="900" fill="#003A69" xml:space="preserve">What you get, whichever group you're in</text><rect x="40" y="642.7" width="165" height="99.0" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="68" cy="667.7466666666667" r="14" fill="#E6F7F1"/><g transform="translate(60 659.7466666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14" /> <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" /> <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5" /> <rect x="3" y="7" width="18" height="4" rx="1" /></g><text x="54" y="700.2" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">A [£X] voucher</text><text x="54" y="714.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">After each survey you fill in.</text><rect x="215" y="642.7" width="165" height="99.0" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="243" cy="667.7466666666667" r="14" fill="#FDE7D3"/><g transform="translate(235 659.7466666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" /></g><text x="229" y="700.2" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">Fun things for your child</text><text x="229" y="714.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">Motivational videos, comic</text><text x="229" y="726.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">books and a newsletter.</text><rect x="390" y="642.7" width="165" height="99.0" rx="14" fill="#FFFFFF" stroke="#DFE5EC" stroke-width="1"/><circle cx="418" cy="667.7466666666667" r="14" fill="#EFEAFD"/><g transform="translate(410 659.7466666666667) scale(0.6666666666666666)" fill="none" stroke="#003A69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /></g><text x="404" y="700.2" font-family="Nunito" font-size="11.5" font-weight="900" fill="#003A69" xml:space="preserve">What we find</text><text x="404" y="714.0" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">A summary of what your family</text><text x="404" y="726.5" font-family="Inter" font-size="9.3" font-weight="400" fill="#12263F" xml:space="preserve">helped to find out.</text><rect x="40" y="758" width="515" height="1" fill="#DFE5EC"/><text x="40" y="776.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve"><tspan font-weight="700">Taking part is your choice. You can stop at any time, without giving a reason.</tspan></text><text x="40" y="792.5" font-family="Inter" font-size="10.5" font-weight="400" fill="#003A69" xml:space="preserve">Questions? Ask [staff name] at school, or email smartphonestudy@public.io.</text><text x="40" y="810.5" font-family="Inter" font-size="8.5" font-weight="400" fill="#4A5B70" xml:space="preserve">Run by IFF Research, PUBLIC and the University of Cambridge for the Department for Education.</text></svg>
